<!-- src/app/features/shared/components/header/header.component.html -->

<header class="header">
  <div class="header-content">
    <div class="header-left">
      <img
        [src]="logoUrl"
        [alt]="titulo"
        class="header-logo"
        (error)="handleImageError($event)"
      >
      <span class="header-title">{{ titulo }}</span>
    </div>

    <div class="header-right">
      <span class="usuario-info">
        <svg class="icon-user" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Hola, {{ usuario?.nombre || 'Usuario' }}
      </span>
      <button class="btn-logout" (click)="logout.emit()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </div>
</header>
