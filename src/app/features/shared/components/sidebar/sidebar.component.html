<!-- src/app/features/shared/components/sidebar/sidebar.component.html -->
<aside class="sidebar" aria-label="Navegación administrativa">
  <nav class="sidebar-menu">
    @for (item of menuItems(); track item.route) {
      <a
        class="sidebar-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        [title]="item.label"
      >
        <span class="sidebar-icon" aria-hidden="true">
          @switch (item.icon) {
            @case ('dashboard') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              </svg>
            }
            @case ('ventas') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3z"/>
                <path d="M9 8h6M9 12h6M9 16h3"/>
              </svg>
            }
            @case ('carta') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 5h16v14H4z"/>
                <path d="M8 9h8M8 13h5M8 17h3"/>
              </svg>
            }
            @case ('personal') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            }
            @case ('historial') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="8" r="3"/>
                <path d="M3 20v-2a4 4 0 0 1 4-4h4"/>
                <circle cx="17" cy="16" r="4"/>
                <path d="M17 14v2l1.5 1"/>
              </svg>
            }
            @case ('reportes') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 2h9l4 4v16H6z"/>
                <path d="M14 2v5h5M9 17v-3M13 17v-6M17 17v-8"/>
              </svg>
            }
          }
        </span>

        <span class="sidebar-label">{{ item.label }}</span>

        <span class="sidebar-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a routerLink="/login-mesero" class="mesero-link" title="Ir al acceso de mesero">
      <span class="mesero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3h8M12 3v4"/>
          <path d="M5 20h14M7 20v-2a5 5 0 0 1 10 0v2"/>
          <path d="M4 12h16"/>
          <path d="M6 12a6 6 0 0 1 12 0"/>
        </svg>
      </span>
      <span>Ir a Mesero</span>
      <svg class="mesero-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </a>
  </div>
</aside>
