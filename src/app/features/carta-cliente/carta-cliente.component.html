<!-- src/app/features/carta-cliente/carta-cliente.component.html -->
<div class="carta-cliente">

  <!-- HEADER CON LOGO IMAGEN -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <h2>hola </h2>
        <img
          src="assets/images/logocarta.jpeg"
          alt="Doña Yacki"
          class="logo-img"
          (error)="onImageError($event)"
        >
        <div>
          <h1>Doña Yacki</h1>
          <span class="slogan">Sabor que enamora</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-admin" (click)="irAdmin()" title="Administrador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
            <line x1="15" y1="21" x2="15" y2="9"/>
          </svg>
        </button>
        <button class="btn-carrito" (click)="toggleCarrito()" [class.has-items]="totalItems() > 0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="carrito-badge" *ngIf="totalItems() > 0">{{ totalItems() }}</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BUSCADOR -->
  <div class="buscador-wrapper">
    <div class="buscador-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        [(ngModel)]="busqueda"
        placeholder="Buscar productos..."
        class="input-buscar"
        (input)="filtrarProductos()"
      >
    </div>
  </div>

  <!-- CATEGORÍAS -->
  <nav class="categorias-nav" *ngIf="!loading()">
    <div class="categorias-scroll">
      <button
        *ngFor="let cat of categoriasActivas()"
        class="categoria-btn"
        [class.active]="categoriaSeleccionada() === cat.id"
        (click)="seleccionarCategoria(cat.id)"
      >
        <span class="categoria-icon" [innerHTML]="getCategoriaIcon(cat.nombre)"></span>
        <span class="categoria-nombre">{{ cat.nombre }}</span>
      </button>
    </div>
  </nav>

  <!-- PRODUCTOS -->
  <main class="productos-container">
    <!-- Loading -->
    <div class="loading-state" *ngIf="loading()">
      <div class="spinner"></div>
      <p>Cargando deliciosas opciones...</p>
    </div>

    <!-- Error -->
    <div class="error-state" *ngIf="error() && !loading()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p>{{ error() }}</p>
      <button class="btn-reintentar" (click)="cargarDatos()">Reintentar</button>
    </div>

    <!-- Grid de productos -->
    <div class="productos-grid" *ngIf="!loading() && !error()">
      <app-producto-card
        *ngFor="let producto of productosFiltradosPorBusqueda()"
        [producto]="producto"
        (agregar)="agregarAlCarrito($event)"
      ></app-producto-card>

      <div class="empty-state" *ngIf="productosFiltradosPorBusqueda().length === 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>No hay productos disponibles</p>
        <span>Prueba con otra categoría o búsqueda</span>
      </div>
    </div>
  </main>

  <!-- CARRITO LATERAL -->
  <app-carrito-lateral
    [visible]="mostrarCarrito()"
    [items]="carrito()"
    [subtotal]="subtotal()"
    [igv]="igv()"
    [total]="total()"
    (cerrar)="mostrarCarrito.set(false)"
    (vaciar)="vaciarCarrito()"
    (eliminar)="eliminarDelCarrito($event)"
    (pagar)="abrirModalPago()"
  ></app-carrito-lateral>

  <!-- MODAL PAGO -->
  <app-modal-pago
    [visible]="mostrarModalPago()"
    [total]="total()"
    [cargando]="cargandoPedido()"
    (cerrar)="cerrarModalPago()"
    (confirmar)="procesarPedido($event)"
  ></app-modal-pago>

  <!-- FLOATING CARRITO (Móvil) -->
  <button
    class="floating-carrito"
    *ngIf="totalItems() > 0 && !mostrarCarrito()"
    (click)="toggleCarrito()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
      <circle cx="9" cy="21" r="1"/>
      <circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    <span class="floating-badge">{{ totalItems() }}</span>
    <span class="floating-total">{{ formatearPrecio(total()) }}</span>
  </button>

</div>
