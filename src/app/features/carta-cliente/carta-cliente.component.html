<!-- src/app/features/carta-cliente/carta-cliente.component.html -->
<div class="carta-cliente">

  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <img
          src="assets/images/logocarta.jpeg"
          alt="Doña Yacki"
          class="logo-img"
          (error)="onImageError($event)"
        >
        <div class="logo-text">
          <h1>Doña Yacki</h1>
          <span class="slogan">Sabor que enamora</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-admin" (click)="irAdmin()" title="Administrador" aria-label="Administrador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
            <line x1="15" y1="21" x2="15" y2="9"/>
          </svg>
        </button>

        <button class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>

        <button class="btn-carrito" (click)="toggleCarrito()" [class.has-items]="totalItems() > 0" aria-label="Carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="carrito-badge" *ngIf="totalItems() > 0">{{ totalItems() }}</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BUSCADOR -->
  <div class="buscador-wrapper">
    <div class="buscador-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        [ngModel]="busqueda()"
        (ngModelChange)="onBusquedaChange($event)"
        placeholder="Buscar productos..."
        class="input-buscar"
        aria-label="Buscar productos"
      >
    </div>
  </div>

  <!-- CATEGORÍAS NAV -->
  <app-categorias-nav
    [categoriaSeleccionada]="categoriaSeleccionada()"
    (categoriaChange)="onCategoriaChange($event)"
  ></app-categorias-nav>

  <!-- PRODUCTOS -->
  <main class="productos-container">
    <div class="loading-state" *ngIf="loading()">
      <div class="spinner"></div>
      <p>Cargando deliciosas opciones...</p>
    </div>

    <div class="error-state" *ngIf="error() && !loading()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p>{{ error() }}</p>
      <button class="btn-reintentar" (click)="cargarProductos()">Reintentar</button>
    </div>

    <div class="productos-grid" *ngIf="!loading() && !error()">
      <app-producto-card
        *ngFor="let producto of productosFiltrados(); trackBy: trackByProductoId"
        [producto]="producto"
        (agregar)="agregarAlCarrito($event)"
      ></app-producto-card>

      <div class="empty-state" *ngIf="productosFiltrados().length === 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>No hay productos disponibles</p>
        <span>Prueba con otra categoría o búsqueda</span>
      </div>
    </div>
  </main>

  <!-- CARRITO LATERAL -->
  <app-carrito-lateral
    [visible]="mostrarCarrito()"
    [items]="carrito()"
    [subtotal]="subtotal()"
    [igv]="igv()"
    [total]="total()"
    (cerrar)="mostrarCarrito.set(false)"
    (vaciar)="vaciarCarrito()"
    (eliminar)="eliminarDelCarrito($event)"
    (pagar)="abrirModalPago()"
  ></app-carrito-lateral>

  <!-- MODAL PAGO -->
  <app-modal-pago
    [visible]="mostrarModalPago()"
    [total]="total()"
    [cargando]="cargandoPedido()"
    [pedidoId]="pedidoCreadoId()"
    [numeroYape]="'902458936'"
    [numeroPlin]="'902458936'"
    (cerrar)="cerrarModalPago()"
    (confirmar)="procesarPedido($event)"
    (subirComprobante)="subirComprobante($event)"
    (confirmarEfectivoCaja)="confirmarEfectivo($event)"
    (confirmarMaquina)="confirmarMaquina($event)"
  ></app-modal-pago>

  <!-- FLOATING CARRITO -->
  <button
    class="floating-carrito"
    *ngIf="totalItems() > 0 && !mostrarCarrito()"
    (click)="toggleCarrito()"
    aria-label="Ver carrito"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"/>
      <circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    <span class="floating-badge">{{ totalItems() }}</span>
    <span class="floating-total">{{ formatearPrecio(total()) }}</span>
  </button>

  <!-- ✅ MODAL DE CONFIRMACIÓN PARA VACIAR EL CARRITO -->
  <app-confirm-dialog
    [visible]="mostrarConfirmVaciar()"
    titulo="¿Vaciar el carrito?"
    mensaje="Se eliminarán todos los productos que agregaste."
    subMensaje="Esta acción no se puede deshacer."
    textoConfirmar="Sí, vaciar"
    textoCancelar="Cancelar"
    tipo="warning"
    (confirmar)="confirmarVaciarCarrito()"
    (cancelar)="cancelarVaciarCarrito()"
  ></app-confirm-dialog>

</div>
