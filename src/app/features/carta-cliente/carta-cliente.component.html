<!-- src/app/features/carta-cliente/carta-cliente.component.html -->
<div class="carta-cliente">
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <img
          src="assets/images/logocarta.jpeg"
          alt="Doña Yacki"
          class="logo-img"
          (error)="onImageError($event)"
        >

        <div class="logo-text">
          <h1>Doña Yacki</h1>
          <span class="slogan">Sabor que enamora</span>
        </div>
      </div>

      <div class="header-actions">
        <button
          class="header-button btn-admin"
          type="button"
          (click)="irAdmin()"
          title="Acceso administrativo"
          aria-label="Acceso administrativo"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
        </button>

        <button
          class="header-button btn-logout"
          type="button"
          (click)="cerrarSesion()"
          title="Cerrar sesión"
          aria-label="Cerrar sesión"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>

        <button
          class="header-button btn-carrito"
          type="button"
          (click)="toggleCarrito()"
          [class.has-items]="totalItems() > 0"
          aria-label="Abrir mi pedido"
          title="Mi pedido"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="carrito-badge" *ngIf="totalItems() > 0">{{ totalItems() }}</span>
        </button>
      </div>
    </div>
  </header>

  <section class="catalogo-toolbar" aria-label="Buscar y filtrar productos">
    <div class="toolbar-content">
      <div class="buscador-container">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          [(ngModel)]="busqueda"
          placeholder="Buscar por nombre o descripción"
          class="input-buscar"
          (input)="filtrarProductos()"
          aria-label="Buscar productos"
        >
      </div>
    </div>
  </section>

  <div class="categorias-wrapper">
    <app-categorias-nav
      [categoriaSeleccionada]="categoriaSeleccionada()"
      (categoriaChange)="onCategoriaChange($event)"
    ></app-categorias-nav>
  </div>

  <main class="productos-container">
    <div class="catalogo-heading">
      <div>
        <span class="catalogo-eyebrow">Nuestra carta</span>
        <h2>Productos disponibles</h2>
      </div>
      <span class="productos-count" *ngIf="!loading() && !error()">
        {{ productosFiltradosPorBusqueda().length }} productos
      </span>
    </div>

    <div class="loading-state" *ngIf="loading()">
      <div class="spinner"></div>
      <p>Cargando productos disponibles...</p>
    </div>

    <div class="error-state" *ngIf="error() && !loading()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p>{{ error() }}</p>
      <button class="btn-reintentar" type="button" (click)="cargarProductos()">Reintentar</button>
    </div>

    <div class="productos-grid" *ngIf="!loading() && !error()">
      <app-producto-card
        *ngFor="let producto of productosFiltradosPorBusqueda()"
        [producto]="producto"
        (agregar)="agregarAlCarrito($event)"
      ></app-producto-card>

      <div class="empty-state" *ngIf="productosFiltradosPorBusqueda().length === 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>No hay productos disponibles</p>
        <span>Prueba con otra categoría o búsqueda</span>
      </div>
    </div>
  </main>

  <app-carrito-lateral
    [visible]="mostrarCarrito()"
    [items]="carrito()"
    [subtotal]="subtotal()"
    [igv]="igv()"
    [total]="total()"
    (cerrar)="mostrarCarrito.set(false)"
    (vaciar)="vaciarCarrito()"
    (eliminar)="eliminarDelCarrito($event)"
    (pagar)="abrirModalPago()"
  ></app-carrito-lateral>

  <app-modal-pago
    [visible]="mostrarModalPago()"
    [total]="total()"
    [cargando]="cargandoPedido()"
    (cerrar)="cerrarModalPago()"
    (confirmar)="procesarPedido($event)"
  ></app-modal-pago>

  <button
    class="floating-carrito"
    type="button"
    *ngIf="totalItems() > 0 && !mostrarCarrito()"
    (click)="toggleCarrito()"
    aria-label="Ver mi pedido"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="9" cy="21" r="1"/>
      <circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    <span class="floating-badge">{{ totalItems() }}</span>
    <span class="floating-label">Ver mi pedido</span>
    <span class="floating-total">{{ formatearPrecio(total()) }}</span>
  </button>
</div>
