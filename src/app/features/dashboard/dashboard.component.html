<div class="dashboard-container">
  <app-header [usuario]="usuario()" (logout)="cerrarSesion()"></app-header>
  
  <main class="dashboard-content">
    <div class="mesas-grid">
      @for (numero of mesas(); track numero) {
        <app-mesa
          [numero]="numero"
          [seleccionada]="mesaSeleccionada() === numero"
          [ocupada]="false"
          (seleccionar)="seleccionarMesa(numero)"
        ></app-mesa>
      }
    </div>

    @if (mesaSeleccionada()) {
      <div class="acciones-container">
        <div class="acciones-mesa">
          <button class="btn-accion btn-gasto" (click)="solicitarGasto()">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            Solicitar Gasto
          </button>
        </div>
      </div>
    }

    <div class="botones-inferiores">
      <button class="btn-inferior" (click)="paraLlevar()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16v16H4z"/>
          <path d="M8 8h8v8H8z"/>
          <path d="M12 4v4"/>
          <path d="M12 16v4"/>
        </svg>
        Para Llevar
      </button>
      
      <button class="btn-inferior" (click)="ultimas()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        Últimas
      </button>
      
      <button class="btn-inferior" (click)="precios()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v2M12 16v2M8 10h2M14 10h2M8 14h8"/>
        </svg>
        Precios
      </button>
      
      <button class="btn-inferior" (click)="delivery()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 4v8l4 4"/>
        </svg>
        Delivery
      </button>
      
      <button class="btn-inferior" (click)="verTickets()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16v16H4z"/>
          <path d="M8 8h8v8H8z"/>
          <path d="M8 12h8"/>
        </svg>
        Ver Tickets
      </button>
      
      <button class="btn-inferior" (click)="porPagar()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
          <circle cx="16" cy="15" r="1"/>
        </svg>
        Por Pagar
      </button>
      
      <button class="btn-inferior" (click)="marcarEntrega()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        Marcar Entrega
      </button>
      
      <button class="btn-inferior btn-salir" (click)="salir()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Salir
      </button>
      
      <button class="btn-inferior btn-cerrar" (click)="cerrarCajaFinal()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Cerrar Caja Final
      </button>
      
      <button class="btn-inferior" (click)="administrar()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        Administrar
      </button>
      
      <button class="btn-inferior" (click)="cerrarCajaIndividual()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
          <circle cx="16" cy="15" r="1"/>
        </svg>
        Cerrar Caja Individual
      </button>
      
      <button class="btn-inferior" (click)="otrosIngresos()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Otros Ingresos
      </button>
      
      <button class="btn-inferior" (click)="reservas()">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <circle cx="12" cy="15" r="1"/>
          <circle cx="16" cy="15" r="1"/>
          <circle cx="8" cy="15" r="1"/>
        </svg>
        Reservas
      </button>
    </div>
  </main>
</div>
