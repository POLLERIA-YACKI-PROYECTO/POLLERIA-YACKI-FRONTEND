<div class="pedido-overlay">
  <div class="pedido-modal">
    <div class="pedido-header">
      <h3>Pedido - Mesa {{ mesaId }}</h3>
      <button class="btn-close" (click)="cerrarPedido()">✕</button>
    </div>

    <div class="pedido-body">
      <div class="productos-section">
        <div class="form-row">
          <div class="form-group">
            <label>Producto</label>
            <select [(ngModel)]="productoSeleccionado">
              <option [ngValue]="null">Seleccionar producto</option>
              @for (producto of productos(); track producto.id) {
                <option [ngValue]="producto">{{ producto.nombre }} - S/ {{ producto.precio }}</option>
              }
            </select>
          </div>
          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" [(ngModel)]="cantidad" min="1" max="99">
          </div>
          <button class="btn-add" (click)="agregarProducto()">Agregar</button>
        </div>

        <div class="items-lista">
          <h4>Items del Pedido</h4>
          @if (itemsPedido().length === 0) {
            <p class="empty-message">No hay items agregados</p>
          }
          @for (item of itemsPedido(); track $index) {
            <div class="item-row">
              <span class="item-nombre">{{ item.nombre }}</span>
              <span class="item-cantidad">x{{ item.cantidad }}</span>
              <span class="item-precio">S/ {{ item.subtotal | number:'1.2-2' }}</span>
              <button class="btn-remove" (click)="eliminarItem($index)">✕</button>
            </div>
          }
        </div>

        <div class="total-section">
          <span class="total-label">Total:</span>
          <span class="total-monto">S/ {{ total() | number:'1.2-2' }}</span>
        </div>
      </div>
    </div>

    <div class="pedido-footer">
      <button class="btn-secondary" (click)="cerrarPedido()">Cancelar</button>
      <button class="btn-success" (click)="guardarPedido()" [disabled]="itemsPedido().length === 0">
        Guardar Pedido
      </button>
    </div>
  </div>
</div>
