# frontend/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Cache de assets estaticos
    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend (opcional, si quieres unificar dominio)
    # Descomenta y ajusta si quieres que /api vaya al backend
    # location /api/ {
    #     proxy_pass http://backend:3000/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}